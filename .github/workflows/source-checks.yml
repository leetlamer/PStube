name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check source hygiene and asset integrity
        run: python3 scripts/check-repository.py
      - name: Check portable metadata and shelf behavior
        working-directory: pstube-ps5
        run: |
          mkdir -p build
          clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=undefined -Isrc tests/features_v013_test.cpp src/shared/core.cpp src/shared/json.cpp -o build/metadata-shelves-test
          ./build/metadata-shelves-test
